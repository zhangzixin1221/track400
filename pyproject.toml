[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track400"
version = "1.1.0"
description = "沿 400m 田径场连续绕圈，经 iPhone 开发者 DVT 通道注入位置"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# 真机注入层才需要；数学层与 FakeDevice 全程零第三方依赖。
device = ["pymobiledevice3==11.36.0"]
dev = ["pytest>=8"]

[project.scripts]
track400 = "track400.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 本机 %TEMP% 下的 pytest-of-* 目录有 ACL 限制（WinError 5），改到项目内
addopts = "-q --basetemp=.pytest_tmp"
